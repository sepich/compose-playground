apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          # image: nginx:1.25.5 # works
          image: registry.k8s.io/ingress-nginx/controller:v1.12.0 # does not work
          command:
            - nginx
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              name: cfg
              subPath: nginx.conf
            - mountPath: /tmp/nginx
              name: tmp
      enableServiceLinks: false
      terminationGracePeriodSeconds: 1
      volumes:
        - name: cfg
          configMap:
            name: nginx
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: nginx
  ports:
    - port: 8080
      targetPort: 80
      protocol: TCP
